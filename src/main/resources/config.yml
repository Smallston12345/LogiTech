ATTRIBUTE_OPERATOR:
  blocked-attributes:
    - SCALE
    - BURNING_TIME
    - FALL_DAMAGE_MULTIPLIER

SpreadBlock:
  Antimass:
    enable-spread: false
    life-default: 13
    max-spread-per-tick: 10
    chance-keep-material: 2
    tick-rate: 5

FinalConvertor:
  random-buffer-range: 10
  max-attempts: 48
  excluded-outputs:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - BARRIER
    - BEDROCK
    - STRUCTURE_BLOCK
