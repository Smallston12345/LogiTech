        - '&7蕪湖起飛'
        - '&7⇨ &a單擊啓動LogiTech'
    INFO:
      Name: '&d%PLUGIN% &6版本與説明'
    MATERIAL:
      Name: '&d%PLUGIN% &6基礎材料'
    ALLMACHINE:
      Name: '&d%PLUGIN% &6堆疊機器支持列表'
    ALLRECIPE:
      Name: '&d%PLUGIN% &6合成配方類型大全'
    URL:
      Name: "&e點擊獲取附屬Github鏈接"
      Lore:
        - ""
        - "&7⇨ &a點擊獲取鏈接"
    WIKI:
      Name: "&e點擊查看附屬wiki"
      Lore:
        - ""
        - "&7⇨ &a點擊獲取鏈接"
    INFO1:
      Name: "&c&l版本號"
      Lore:
        - "&7當前%PLUGIN%版本："
        - "&b&m%VERSION% &6&r正式版"
        - "&7更多版本,敬請期待!"

    INFO2:
      Name: "&e&l聯繫我們"
      Lore:
        - "&7如果您想要彙報bug"
        - "&7或者提出一些有趣的點子"
        - "&7請在上方的github鏈接中提出issue"
        - "&7但凡是有用的提議作者都會考慮採納"
    INFO3:
      Name: "&a&l附屬介紹"
      Lore:
        - "&7我們的附屬立志於開發新功能"
        - "&7以及有趣的機制,"
        - "&7雖然傳統的堆機器或許不可避免"
        - "&7但是我們希望能為玩家帶來別樣的體驗"
    INFO4:
      Name: "&c&l一些聲明"
      Lore:
        - "&7本附屬可能在創作上會借鑑一些附屬"
        - "&7您也可能找到相似的特性"
        - "&7但是本附屬特性實現均為作者手寫"
        - "&7實現這些有趣的特性也是作者興趣所致,也是作者的目標"
        - "&7若出現問題/BUG請找作者matl114"
    INFO5:
      Name: "&c&l更多的聲明"
      Lore:
        - "&e主線版本不提供%MAX_MC_VERSION%+的問題修復"
        - "&7若在%MAX_MC_VERSION%+版本使用機器出現問題"
        - "&7你可以將問題反饋到github的issue"
        - "&7不過作者不會保證修復該問題"
        - "&a建議將問題反饋到你所使用的支持%MAX_MC_VERSION%+的fork倉庫"
    INFO6:
      Name: "&6&l附屬特性"
      Lore:
        - "&7本附屬擁有一些和其他附屬不同的特性"
        - "&7在此會在下方指出"
        - "&7當您在遊玩的時候遇見無法理解的設定"
        - "&7請仔細閲讀以下的説明"
    FEAT1:
      Name: "&6&l特性 - &c&l重寫的進程機器"
      Lore:
        - "&7本附屬的進程機器(即擁有進度條)的機器與普通進度機器不同"
        - "&7採用了附屬自研的配方算法和推送算法"
        - "&7並且機器保證0tick配方可以無間隔合成"
        - "&7若機器出現問題,請找作者"
    FEAT2:
      Name: "&6&l特性 - &c&l配方機器,生成器與定向生成器"
      Lore:
        - "&7配方機器指的是使用機器配方進行合成的機器"
        - "&7生成器指的是材料生成器,不會消耗物品而持續產出的機器"
        - "&7本附屬擁有多種生成器"
        - "&7其中定向生成器需要輸入槽插入指定配方才能進行對應產出"
        - "&7若機器出現問題,請找作者"
    FEAT3:
      Name: "&6&l特性 - &c&l高級機器與並行處理數"
      Lore:
        - "&7本附屬新增了高級機器,擁有更多輸入輸出槽和更多特性"
        - "&7並行處理數指機器在配方搜索時會嘗試利用並行數減少合成時間/增大合成數量"
        - "&7機器會嘗試減少<進程時間>為<進程時間>/<並行處理數>"
        - "&7若<進程時間>無法繼續減少,則會按<並行處理數>/<進程時間>為最大次數儘可能多的匹配機器配方"
        - "&7若機器出現問題,請找作者"
    FEAT4:
      Name: "&6&l特性 - &c&l工作站與一鍵放入"
      Lore:
        - "&7工作站可以用來進行有序的配方合成"
        - "&7工作站支持查看當前機器配方"
        - "&7大型6x6工作站配方在\"大型配方展示\"菜單"
        - "&7或對應工作站的配方按鈕查看"
        - "&7一鍵放入支持你快速將物品以配方格式放入工作站"
        - "&7若機器出現問題,請找作者"
    FEAT5:
      Name: "&6&l特性 - &c&l大型多方塊機器"
      Lore:
        - "&7大型多方塊機器由多方塊核心,多方塊部件,多方塊IO接口組成"
        - "&7多方塊核心擁有界面,並且通常提供全息投影,這會指導你搭建多方塊機器"
        - "&e注意:請將客户端版本置於java 1.19.4及更高,低版本和基岩版不保證正常顯示投影"
        - "&e注意:使用/logitech multiblock 可以查看搭建教程"
        - "&7多方塊機器構建需求:多方塊機器需要保證結構合規,不與其他多方塊衝突,可能有額外的需求(如電力需求或者位置為空需求)"
        - "&7多方塊機器運行需求:只要多方塊機器結構完整即可進行運行"
        - "&7運行中多方塊機器出現特殊要求不滿足時會自發關閉多方塊機器"
        - "&e注意:有些多方塊機器擁有關閉檢查,若關閉時進度仍進行可能觸發嚴重後果!"
        - "&7自動構建模式為否時多方塊機器搭建完成後需要手動點擊界面中的構建按鈕進行激活"
        - "&7啓用自動構建將禁用構建按鈕的功能並且會自發的異步檢測結構與激活機器"
        - "&7點擊多方塊部件將會嘗試打開該多方塊部件所屬的多方塊機器界面,shift點擊則正常交互"
        - "&7多方塊IO接口可以替換指定的多方塊部件作為多方塊機器的一部分,對多方塊機器界面進行推送/抓取"
        - "&7若機器出現問題,請找作者"

    FEAT6:
      Name: "&6&l特性 - &c&l序列輸入配方與貨運系統"
      Lore:
        - "&7序列輸入配方應用於序列進度機器,其由若干輸入需求順序組成"
        - "&7輸入與第一個需求相匹配的物品來發起進程"
        - "&7進程分若干階段,每個階段要求某一種物品輸入若干數量和<最小處理時間>"
        - "&7一個階段會在<最小處理時間>到達且輸入數量滿足的時候結束"
        - "&7一個階段結束會發起下一階段,順序執行,直到全部滿足,輸出結果"
        - "&7機器一般提供自動清除按鈕,啓動則會在當前階段物品不匹配輸入槽全部物品時清除輸入槽全部物品"
        - "&7雖然這很難自動化,但是相應的,我們會提供貨運機器作為一個自動化手段"
        - "&7若機器出現問題,請找作者"
    FEAT7:
      Name: "&6&l特性 - &c&l貨運機器與可調控貨運機器"
      Lore:
        - "&7本附屬提供普通貨運機器與智能貨運機器兩種分類"
        - "&7其區別在於是否讀取槽位限制與是否可調控"
        - "&7普通貨運機器支持無上限數量傳輸,但是會一直運行並不讀取槽位限制"
        - "&7槽位限制: 機器可能根據不同的輸入物品指定不同的可推送槽位"
        - "&7智能貨運普遍使用槽位限制,但是其傳輸數量通常最大為576"
        - "&7可調控貨運機器的一個特點是可使用某些的條件編寫貨運機器的行為，如運行內容,運行週期"
        - "&7其中,芯片調控是可配置性較高的一種"
        - "&7一般芯片調控的機器為32一週期,週期地讀取芯片32位數據上的01字位"
        - "&7並按照讀取結果為0/1執行不同的行為!"
        - "&7支持芯片調控的機器共用同步ticker,任意運行時間他們獲得的tick計數器嚴格相同"
        - "&7他們讀取的芯片位數會嚴格相同,並不會因為放置先後而造成差異!"
        - "&e本附屬的貨運機器使用貨運配置卡配置"
        - '&e當你在貨運機器的槽位説明中看到\"需要放入配置卡\",請在配置卡配置台中閲讀説明'
        - "&7若機器出現問題,請找作者"

    FEAT8:
      Name: "&6&l特性 - &c&l堆疊機器類與工作效率"
      Lore:
        - "&7堆疊機器,顧名思義,指可以將其他機器堆疊入指定槽位"
        - "&7堆疊機器將載入其配方,並代替其進行合成"
        - "&7\"堆疊效率\"決定單個機器的產速放大倍率"
        - "&7機器並行處理數為<槽位中堆疊的數量>*<堆疊效率>"
        - "&7槽位和輸入輸出槽一樣會支持\"終極合成\"特性"
        - "&7堆疊機器分為堆疊配方機器與堆疊生成器"
        - "&7其分別支持合法的配方機器和生成器"
        - "&7其中,配方機器的並行處理將試圖加速進程"
        - "&7而堆疊生成器的並行處理只會倍率增大產出數量"
        - "&c注意,本附屬提供配置文件修改堆疊機器的列表與配方"
        - "&c並同時支持修改部分機器的配方"
        - "&c請服務器管理員謹慎處理配置文件"
        - "&e注意:本附屬不支持rsc等任意粘液插件的熱重載"
        - "&e因熱重載而導致堆疊機器失效,作者不負任何責任"
        - "&a附屬即將開啓\"全民創作者\"計劃,鼓勵大家參與完善配置文件"
        - "&a用於兼容那些奇怪但高效的附屬,讓堆疊列表更加完善"
    FEAT9:
      Name: "&6&l特性 - &c&l終極合成"
      Lore:
        - "&7終極合成支持從合法的非空存儲類物品中進行取出/存入"
        - "&7並且支持該特性的合成/進程可以直接訪問其中的物品存儲"
        - "&e用人話講,就是"
        - "&e可以直接消耗存儲類物品或者鏈接綁定的實體存儲內的物品參與合成"
        - "&e產出的物品也可以直接地存入存儲類物品或者鏈接綁定的實體存儲"
        - "&e但是參與合成的這類物品必須是非空的存儲.機器並不會幫你設置存儲種類!"
        - "&7當前支持的物品:"
        - "&7邏輯工藝 概念奇點存儲(存儲類物品)"
        - "&7邏輯工藝 量子糾纏奇點(存儲鏈接物品)"
        - "&7網絡(拓展) 量子存儲系列(存儲類物品)"
        - "&a建議:多使用量子糾纏奇點,可以大幅度減少卡頓!"
        - "&c備註:由於網絡拓展版本更迭過快,不保證支持全部版本"
        - "&7擁有這類特性的機器通常擁有極致的合成速度來支持此特性"
        - "&7若機器出現問題,請找作者"
    UPDATELOG:
