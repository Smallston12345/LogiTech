stack_type:
  #用於強制改變設置某些機器為 機器 或者 生成器 並改變電力耗量
  LOGITECH_LOGIC_REACTOR:
    #type支持"none","machine","generator"
    #設置為none則會將該機器從兩個堆疊中移除
    type: "none"
    #設置電力消耗/t*機器數
    #設置為-1則不會更改 自動獲取的電力
    energy: -1
  SILVER:
    #type支持"none","machine","generator"
    #設置為none則會將該機器從兩個堆疊中移除
    type: "generator"
    #設置電力消耗/t*機器數
    #設置為-1則不會更改 自動獲取的電力
    energy: 200

recipe_modify:
  #提醒：本功能不保證修改特殊機器時不出問題，
  #本附屬的若干機器是不能修改的，但是大部分是可以修改的.
  #使用者要承擔自己的風險！
  #*************************************************
  #這裏寫要修改的sf物品id

  CARBON_PRESS:
    #mode是操作方式 允許a+ a w+ w
    #a代表添加 w代表覆寫 +代表是否嘗試修改原機器配方 若不加+則只會修改堆疊機器配方
    #警告: "+"慎用,可能造成無法預知的錯誤！
    #注意 當你希望對非生成器加入生成器配方 請使用“w" 否則可能無法加載入堆疊生成器
    mode: "a+"
    #機器類型 支持 machine 和 generator(材料生成器)
    #分別會添加到堆疊機器和堆疊生成器上
    #若為生成器則不會嘗試修改原機器配方！
    type: "machine"
    #當你不想要修改機器或者想要刪除原來配方 可以不寫這個
    recipe:
      #名字隨意 順序讀取
      example_recipe:
        input:
          #每個物品都要一個不同的標號 因為列表不支持某些設置
          #在這裏寫入 數量+id 即可解析為物品
          #銅錠將會被解析為黏液銅錠
          #應該沒人用原版銅這種垃圾吧
          1: "3BEDROCK"
        output:
          1:
            #關於抽象物品組的説明請看下面的註釋
            type: "ra"
            item:
              1: "DIAMOND"
              2: "DIAMOND_ORE"
            weight:
              1: 3
              2: 1
        #耗時 黏液刻為單位
        tick: 5

  #這是一個抽象示例，實際上銅粉不能產任何東西 但是我們可以配置它讓他在堆疊機器中產出
  COPPER_DUST:
    mode: "w"
    type: "machine"
    recipe:
      example_abstract_recipe:
        input:
          1:
            #*************************************************************************
            #配方表支持使用抽象物品組 但是不保證對原機器配方的修改一定有效
            #經過測試本附屬機器和原版AContainer是支持修改抽象物品組的,並且都能使用
            #類型有
            #ra (從若干物品中按權重出一個)
            #rc (隨機數量的物品)
            #eq (等價輸入,指輸入任意一個都可以匹配)
            #rp (一定的概率為當前物品 一定概率為空)
            #(未啓用)dp(展示物品,將在整合配方的時候自動丟棄)
            type: "eq"
            item:
              #其中寫的物品的數量都不重要 只要是正數就行
              1: "BEDROCK"
              2: "COMMAND_BLOCK"
            #為了統一格式 寫weight
            weight:
              #要求必須寫amount 代表該物品組應當匹配的物品數量
              amount: 1
            #這一坨我們可以看作一個物品 他是一個類型為eq的抽象物品組
            #*************************************************************************
        output:
          1:
            #這是輸出的第一個物品組 它是一個ra類型的抽象物品組
            #*********************************************************************************************
            type: "ra"
            item:
              1: #抽象物品組支持嵌套,(雖然有些嵌套可能並不像想的那樣
                #******************************************
                type: "rp"
                item:
                  1:
                    #*********************
                    type: "rc"
                    item:
                      1: "DIRT"
                    weight:
                      #這裏的weight指的是從3-23隨機數量
                      #我們要求使用者 在 “rc”且 僅在"rc“模式下寫min和max
                      min: 1
                      max: 4

                    #*********************
                #每項item的標誌要和weight對應 不然會加載失敗，即1 :item對應1： weight
                weight:
                  #這裏的weight指的是百分比概率
                  #我們要求使用者 在 “rp”且 僅在"rp“模式下寫 百分比概率
                  1: 66
                #******************************************
              2: "DIAMOND"
            weight:
              #這裏的weight指的是對應的物品組的權重
              #我們要求使用者 在 “ra”且 僅在"ra“模式下寫 各個組分的權重
              #這裏的1 4 指 item裏對應的第一個物品有 1/(1+4)=20%概率輸出 第二個物品有4/(1+4)=80%概率輸出
              1: 1
              2: 2
            #經過上面的配置 我們應該可以獲得一個隨機物品組 80%出一個鑽石 20%*66%出3-23隨機數量的泥土 和剩下的概率什麼都不出,作為機器第一個輸出
            #*********************************************************************************************
            #這是輸出的第二個物品組,他是一個正常的物品
          2: "LOGITECH_NOLOGIC"
        #耗時 黏液刻為單位
        tick: 114514
  #這是一個抽象示例，實際上銅粉不能產任何東西 但是我們可以配置它讓他在堆疊機器中產出
  SILVER_DUST:
    mode: "w"
    type: "generator"
    recipe:
      example_abstract_recipe:
        output:
          1:
            #這是輸出的第一個物品組 它是一個ra類型的抽象物品組
            #*********************************************************************************************
            type: "ra"
            item:
              1: #抽象物品組支持嵌套,(雖然有些嵌套可能並不像想的那樣
                #******************************************
                type: "rp"
                item:
                  1:
                    #*********************
                    type: "rc"
                    item:
                      1: "DIRT"
                    weight:
                      #這裏的weight指的是從3-23隨機數量
                      #我們要求使用者 在 “rc”且 僅在"rc“模式下寫min和max
                      min: 3
                      max: 23

                    #*********************
                #每項item的標誌要和weight對應 不然會加載失敗，即1 :item對應1： weight
                weight:
                  #這裏的weight指的是百分比概率
                  #我們要求使用者 在 “rp”且 僅在"rp“模式下寫 百分比概率
                  1: 66
                #******************************************
              2: "DIAMOND"
            weight:
              #這裏的weight指的是對應的物品組的權重
              #我們要求使用者 在 “ra”且 僅在"ra“模式下寫 各個組分的權重
              #這裏的1 4 指 item裏對應的第一個物品有 1/(1+4)=20%概率輸出 第二個物品有4/(1+4)=80%概率輸出
              1: 1
              2: 4
            #經過上面的配置 我們應該可以獲得一個隨機物品組 80%出一個鑽石 20%*66%出3-23隨機數量的泥土 和剩下的概率什麼都不出,作為機器第一個輸出
            #*********************************************************************************************
            #這是輸出的第二個物品組,他是一個正常的物品
          2: "2LOGITECH_NOLOGIC"
        #耗時 黏液刻為單位
        tick: 1919810