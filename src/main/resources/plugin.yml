## CHANGE 更改此處為你的附屬名稱
name: LogiTech

## CHANGE 更改此處為你的名稱
author: matl114

## CHANGE 這是對你插件的介紹
description: Logical Slimefun4-Addon To Make A Better World

## CHANGE 指向你的 JavaPlugin 主類
main: me.matl114.logitech.MyAddon

## 你可以更改為你的項目倉庫地址，或者你的個人網站。你也可以移除此項目。
website: https://github.com/m1919810/LogiTech

## 該值將在構建時被自動替換為pom.xml中定義的版本。
## 不要更改此項目。
version: ${project.version}

## 這是運行該附屬所需的最低MC版本。
api-version: '1.21'

## 指定 Slimefun 作為依賴項，必須

depend:
- Slimefun
- GuizhanLibPlugin
softdepend:
- InfinityExpansion
- Networks

commands:
  logitech:
    description: basic logitech command
    aliases: lc
    usage: 'ask the author,pls.I dont think theres a need for you to use these commands'

permissions:
  logitech.command.op:
    description: Allows you to use operator commands
    default: op
  logitech.command.antimass-status:
    description: Allows you to view the current antimass production capacity
    default: op
  logitech.shell.root:
    description: Allows you to open root shell without password
    default: op
  logitech.shell.test:
    description: Allows you to use test operator tools
    default: op
  logitech.experimental.test:
    description: Allows you to use experimental items
    default: op
  logitech.antimass.limit-bypass:
    description: Allows limited antimass placement after the global placement cap is reached
    default: false
